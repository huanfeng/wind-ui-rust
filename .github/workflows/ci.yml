name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的旧运行被新推送取消，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 格式检查
        run: cargo fmt --check

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy（零警告）
        run: cargo clippy --all-targets -- -D warnings
      # 默认 feature 之外唯一在用的组合（wind-portable 用 default-features = false）。
      # 它的消费者在别的仓里，本仓的 example 又全跑默认 feature——没有这条，svg/d2d
      # 关闭时的门控疏漏一路溜到发布版才被发现（0.11.0 即如此）。
      - name: Clippy（关闭默认 feature）
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      # 跨平台 GPU 后端（wgpu）。**macOS 不在这里跑**：那边后端是默认编入的，上面
      # 三步（build / test / clippy）已经覆盖；`gpu` feature 只对非 macOS 目标有意义。
      #
      # Windows runner 走 DX12/WARP 软件回退；Linux runner 通常没有 Vulkan/GL 适配器。
      # 拿不到适配器时 GPU 用例会打印「跳过」后返回——绿灯不等于跑了，怀疑时进日志搜
      # 「跳过：本机没有可用的 wgpu 适配器」。Linux 上这一档守的主要是「能编译」：
      # Linux 平台层尚未接 GPU 呈现，但 `src/render/gpu/` 在那里照样要编得过。
      - name: Clippy（gpu feature，非 macOS）
        if: runner.os != 'macOS'
        run: cargo clippy --all-targets --features gpu -- -D warnings
      - name: Test（gpu feature，非 macOS）
        if: runner.os != 'macOS'
        run: cargo test --features gpu

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 检查每个提交的 Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for c in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::提交 $c 缺少 Signed-off-by（DCO）。请用 git commit -s 重新签署。"
              fail=1
            fi
          done
          exit $fail
